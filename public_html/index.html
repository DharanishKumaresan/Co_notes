<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Co notes</title>
<meta name="color-scheme" content="dark light">

<!-- Installable. theme-color is kept in step with the open board's ground by
     syncThemeColor() in app.js, so the system chrome matches the theme. -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#15180F" id="meta-theme-color">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Co notes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css?v=19">
</head>
<body>

<div id="bg"></div>

<div id="shell">
<div id="screen">

  <div class="head">
    <div id="me-avatar"></div>
    <div class="head-id">
      <div class="head-name"><span id="me-name">—</span><span class="live-dot" id="live"></span></div>
      <button class="head-role" id="me-role" aria-label="Switch board">
        <span id="me-role-text">shared board</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>
    <button class="icon-btn" id="btn-layout" aria-label="Switch layout"></button>
    <button class="icon-btn" id="btn-sync" aria-label="Sync now">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11A8 8 0 0 0 6.3 5.7L3 9"/><path d="M4 13a8 8 0 0 0 13.7 5.3L21 15"/><path d="M3 4v5h5"/><path d="M21 20v-5h-5"/></svg>
    </button>
  </div>

  <div class="greet" id="greet"></div>

  <div class="search hidden" id="search">
    <input id="q" type="text" placeholder="Search cards on this board" autocomplete="off" spellcheck="false" maxlength="120">
    <svg class="search-ico" id="q-ico" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
    <button class="search-clear hidden" id="q-clear" aria-label="Clear search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div class="chips" id="chips"></div>
  <div class="body" id="view"></div>

  <!-- On a phone this element generates no box at all (.side is display:contents),
       so the header, the tab bar and the board below it sit exactly where they
       always have. On a desktop it becomes the left rail: wordmark, navigation,
       and the persistent list of boards. -->
  <aside class="side">
    <div class="side-brand">
      <!-- The app's mark, in its small-size form: one card with two rules, the
           same drawing the 32px favicon uses. The 192px icon shows two
           overlapping cards, but at 20px the second one collapses into what
           reads as a drop shadow - so this matches the favicon, and the browser
           tab and the rail agree.

           Inline rather than /icons/icon-192.png: crisp at this size, and it
           follows the board's theme through `currentColor` where the PNG is
           baked to Lime.

           One path with `fill-rule="evenodd"`, not a filled rect with a masked
           cut-out. Both draw the same thing, but a mask needs `url(#id)`, and a
           fragment reference does not resolve when the document itself is a
           `data:` URL - which is exactly what the preview harness is. The mask
           version rendered as a solid blob in the harness and correctly on the
           server, which is the worst way round for a thing whose whole job is
           to be checked in the harness. The holes also mean the rules show the
           ground through, so this is right in light mode too. -->
      <svg class="side-mark" width="20" height="20" viewBox="0 0 24 24"
           fill="currentColor" fill-rule="evenodd" aria-hidden="true">
        <path d="M7.6 2.5H16.4A3.6 3.6 0 0 1 20 6.1V17.9A3.6 3.6 0 0 1 16.4 21.5H7.6A3.6 3.6 0 0 1 4 17.9V6.1A3.6 3.6 0 0 1 7.6 2.5ZM8.6 8H15.4A1.2 1.2 0 0 1 15.4 10.4H8.6A1.2 1.2 0 0 1 8.6 8ZM8.6 13H11.8A1.2 1.2 0 0 1 11.8 15.4H8.6A1.2 1.2 0 0 1 8.6 13Z"/>
      </svg>
      Co notes
    </div>

    <div class="tabbar">
      <button class="tab on" data-tab="notes">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H17l3 3v12.5A2.5 2.5 0 0 1 17.5 21h-11A2.5 2.5 0 0 1 4 18.5z"/><path d="M8 8h6M8 12h8M8 16h5"/></svg>
        <span class="label">Cards</span>
      </button>
      <button class="tab" data-tab="calendar">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        <span class="label">Calendar</span>
      </button>
      <button class="tab add" id="tab-new" aria-label="New card">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span class="label">New card</span>
      </button>
      <button class="tab" data-tab="activity">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-7 5 14L17 12h4"/></svg>
        <span class="label">Activity</span>
      </button>
      <button class="tab" data-tab="you">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
        <span class="label">Profile</span>
      </button>
    </div>

    <div class="side-boards" id="side-boards"></div>
  </aside>

  <div class="sheet-scrim" id="scrim"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-head">
      <button class="icon-btn" id="e-back" aria-label="Back to the board">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="menu-wrap">
        <button class="icon-btn" id="e-menu" aria-label="Card actions" aria-haspopup="menu" aria-expanded="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/></svg>
        </button>
        <div class="menu hidden" id="e-menu-pop" role="menu">
          <button class="menu-item" id="m-flag" role="menuitem">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h13l-2.5 4.5L18 12H6"/><path d="M6 3v18"/></svg>
            <span id="m-flag-txt">Flag this card</span>
          </button>
          <button class="menu-item" id="m-date" role="menuitem">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
            <span id="m-date-txt">Add a date</span>
          </button>
          <button class="menu-item danger" id="m-delete" role="menuitem">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></svg>
            <span>Delete this card</span>
          </button>
        </div>
      </div>
    </div>
    <div class="sheet-body">
      <input id="e-title" placeholder="Untitled card" maxlength="120" autocomplete="off">

      <div class="card-tags" id="e-tags"></div>

      <div class="rich" id="e-read"></div>
      <!-- The editor is a transparent textarea over a styled mirror of the same
           text: the textarea stays the source of truth and the caret, the
           mirror only paints. See "the editor mirror" in app.js. -->
      <div class="editor-wrap hidden" id="e-editor">
        <div class="editor-mirror" id="e-mirror" aria-hidden="true"></div>
        <textarea id="e-content" placeholder="Start writing. Everyone on this board sees it."></textarea>
      </div>

      <div class="conflict hidden" id="conflict">
        <b>Someone else saved this card</b>
        <p id="conflict-text">Your version and theirs are both here. Keep whichever you want.</p>
        <div class="conflict-actions">
          <button class="mini-btn acc" id="conflict-keep">Keep mine</button>
          <button class="mini-btn" id="conflict-theirs">Use theirs</button>
        </div>
      </div>

    </div>

    <div class="sheet-foot">
      <div class="fmt-bar hidden" id="e-tools">
        <button class="fmt" data-inline="bold" title="Bold" aria-label="Bold"><b>B</b></button>
        <button class="fmt" data-inline="italic" title="Italic" aria-label="Italic"><i>I</i></button>
        <button class="fmt" data-inline="underline" title="Underline" aria-label="Underline"><u>U</u></button>
        <span class="fmt-sep"></span>
        <button class="fmt" data-block="heading" title="Heading" aria-label="Heading"><b>H</b></button>
        <button class="fmt" data-block="bullet" title="Bullet list" aria-label="Bullet list">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <circle cx="5" cy="6.5" r="1.4" fill="currentColor" stroke="none"/>
            <circle cx="5" cy="12" r="1.4" fill="currentColor" stroke="none"/>
            <circle cx="5" cy="17.5" r="1.4" fill="currentColor" stroke="none"/>
            <path d="M10 6.5h9M10 12h9M10 17.5h6"/>
          </svg>
        </button>
        <button class="fmt" data-block="task" title="Checklist" aria-label="Checklist">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>
        </button>
        <span class="fmt-sep"></span>
        <button class="fmt" id="e-clear-ticked" title="Clear ticked items" aria-label="Clear ticked items">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M8 12.5l2.5 2.5L16 9.5"/><path d="M3.5 20.5l17-17"/></svg>
        </button>
        <!-- Not a style, so it does not sit with the styles: it is pushed to
             the far edge and is the only button here wearing the accent. -->
        <button class="fmt fmt-done" id="e-done" title="Done formatting" aria-label="Done formatting">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
          <span class="fmt-done-label">Done</span>
        </button>
      </div>

      <div class="edited-by" id="e-meta"></div>
    </div>
  </div>

  <div class="modal hidden" id="modal">
    <div class="modal-card" id="modal-card"></div>
  </div>

  <div class="boot" id="boot">Opening the board…</div>
  <div class="toast" id="toast"></div>

</div>
</div>

<div id="grain"></div>

<script src="/assets/app.js?v=19"></script>
</body>
</html>
